# Applies server/supabase/migrations to the STAGING Supabase project only.
# Manual run (Actions -> "DB migrations (staging)" -> Run workflow).
# Production migrations are NOT in CI: they need your explicit approval and are
# run by hand behind the production guard (docs/deploy/DEPLOYMENT.md, Stage 11).
#
# Secrets are passed only to the steps that need them; the third-party setup
# action is pinned to a commit SHA and never sees a secret.
name: DB migrations (staging)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run shows pending migrations; apply pushes them"
        type: choice
        options: [dry-run, apply]
        default: dry-run

permissions:
  contents: read

concurrency:
  group: staging-db
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Refuses unless every setting points at the staging project in targets.json.
      - name: Staging guard
        run: node scripts/assert-staging.js
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.121.0
      - name: Link, list, dry-run, apply, advisors
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          supabase migration list --linked
          supabase db push --linked --dry-run
          if [ "$MODE" = "apply" ]; then
            supabase db push --linked --yes
            supabase migration list --linked
            # T4: fail the run on any security warning
            supabase db advisors --linked --type security --level warn --fail-on warn
          fi
